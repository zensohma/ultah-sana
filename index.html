<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Ulang Tahun, Sayangku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!--
  ======================================================================
  CARA MENGGUNAKAN TEMPLATE INI
  1. Cari komentar "GANTI DI SINI" di bagian HTML untuk mengubah teks,
     nama, dan pesan.
  2. Untuk mengganti foto: cari <div class="photo-placeholder"> di
     bagian galeri, lalu ganti ISI div tersebut dengan:
       <img src="data:image/jpeg;base64,PASTE_BASE64_DI_SINI" alt="...">
     Gunakan format base64 (bukan link biasa) supaya foto tetap muncul
     saat halaman ini dipublikasikan atau dibuka secara online.
     Kalau kamu membuka file ini langsung di komputer/laptop, kamu juga
     boleh pakai src="nama-file.jpg" biasa asal foto ada di folder yang
     sama.
  3. Jumlah kartu foto bebas ditambah/dikurangi, tinggal salin salah
     satu blok <div class="polaroid ..."> lalu ubah isinya.
  ======================================================================
-->


</head>
<body>

<!-- ===================== HALAMAN 1 — UCAPAN ===================== -->
<section class="hero">
  <div class="hearts-field" id="heartsField" aria-hidden="true"></div>

  <div class="hero-content">
    <!-- GANTI DI SINI: baris pembuka kecil -->
    <p class="hero-intro">Untuk kakak</p>

    <!-- GANTI DI SINI: judul dan nama -->
    <h1 class="hero-title">
      Selamat ulang tahun,
      <span class="hero-name">Sayangku</span>
    </h1>

    <div class="hero-divider"></div>

    <!-- GANTI DI SINI: isi pesan ucapan -->
    <p class="hero-message">
        Selamat ulang tahun kakak sayang ❤️
    </p>
  </div>

  <button class="scroll-cue" id="scrollCue" type="button">
    lihat kenangan kita
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
</section>

<!-- ===================== HALAMAN 2 — GALERI FOTO ===================== -->
<section class="gallery" id="gallery">
  <div class="gallery-header">
    <!-- GANTI DI SINI: judul dan subjudul galeri -->
    <h2 class="gallery-title">Kenangan yang adek simpan</h2>
    <p class="gallery-subtitle">Beberapa potongan waktu yang bikin adek makin sayang sama kakak.</p>
  </div>

  <div class="polaroid-grid">
    <!-- Salin salah satu blok .polaroid di bawah ini untuk menambah foto -->
    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/IMG-20250914-WA0014.jpg" alt="Pertemuan pertama kita"></div>
      <figcaption class="polaroid-caption">Riemann 2025</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/IMG-20260602-WA0013.jpg" alt="Momen yang selalu kurindukan"></div>
      <figcaption class="polaroid-caption">Fotbar pertama setelah comeback xixixix</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/SAVE_20260611_200255.jpg" alt="Liburan impian"></div>
      <figcaption class="polaroid-caption">foto ke-sekian setelah comeback cihuuyyy</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/IMG-20260822-WA0033.jpg" alt="Senyum favoritku"></div>
      <figcaption class="polaroid-caption">pas di taman cerdas sebelum beliau berangkat ke muara badak T_T</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/IMG-20260827-WA0023.jpg" alt="Kenangan tak terlupakan"></div>
      <figcaption class="polaroid-caption">habis kelas opnum</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/IMG_20260726_193249_205.webp" alt="Awal dari selamanya"></div>
      <figcaption class="polaroid-caption">ketemu lagi setelah dia merantauuu</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/wizzme.jpg" alt="Awal dari selamanya"></div>
      <figcaption class="polaroid-caption">makan wizzme setelah manit riemann day 1</figcaption>
    </figure>

    <figure class="polaroid reveal">
      <div class="photo-placeholder"><img src="img/riemann.jpg" alt="Awal dari selamanya"></div>
      <figcaption class="polaroid-caption">manit riemann day 2 cihuuyy</figcaption>
    </figure>
  </div>

  <!-- GANTI DI SINI: kalimat penutup -->
  <div class="closing reveal">
    <p class="closing-line">Sampai ulang tahun berikutnya, dan yang berikutnya lagi.</p>
    <p class="closing-sub">Adek sayang kakak. 💗</p>
  </div>
</section>

<button class="back-to-top" id="backToTop" type="button" aria-label="Kembali ke atas">↑</button>
<script src="scirpt.js"></script>t



</body>
</html>
